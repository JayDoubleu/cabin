# Flatpak manifest for Cabin.
#
# Build with:
#   flatpak-builder --user --install --force-clean \
#       _flatpak build-aux/io.github.jaydoubleu.Cabin.yaml
#
# cargo-sources.json must be current. Regenerate it after any Cargo.lock
# change with "just flatpak-sources".
id: io.github.jaydoubleu.Cabin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cabin

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cabin/cargo
    CABIN_CARGO_OFFLINE: '1'

finish-args:
  # Display and rendering for the viewer.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # RDP runs over TCP to a port the container publishes on loopback.
  - --share=network

  # Guest audio over RDPSND. Scheduled after the first release.
  - --socket=pulseaudio

  # The Podman REST socket. Marking the directory read-only still allows
  # read-write use of the socket inside it, and stops Cabin writing files
  # next to it.
  - --filesystem=xdg-run/podman:ro

  # Per-desktop RDP credentials live in the host keyring.
  - --talk-name=org.freedesktop.secrets

# Deliberately NOT requested:
#   --filesystem=home            Mount paths come from the file chooser portal.
#   --talk-name=org.freedesktop.Flatpak   That would be a sandbox escape.

modules:
  # FreeRDP is not in the GNOME runtime, and Cabin needs it because
  # gnome-remote-desktop requires the MS-RDPEGFX graphics pipeline. See
  # DESIGN.md section 14.
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      # Cabin links the client library. None of FreeRDP's own clients, servers
      # or tools are used, and each one is build time and attack surface.
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_MANPAGES=OFF
      # FreeRDP warns at runtime that AV1 is experimental and "might crash the
      # application". The guest sends RemoteFX Progressive in any case, because
      # a container with no render node has no hardware encoder. See section
      # 15.5. Building it out removes a whole codec path Cabin never uses.
      - -DWITH_GFX_AV1=OFF
      # The clipboard mounts a FUSE filesystem, which Cabin deliberately never
      # asks for: it crashes the guest daemon. See section 15.2.
      - -DWITH_FUSE=OFF
      # On by default, and FreeRDP warns at runtime that it "might slow down
      # the application". It is a development aid, not something to ship.
      - -DWITH_VERBOSE_WINPR_ASSERT=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_FFMPEG=OFF
    cleanup:
      - /bin
      - /share/man
      - /share/FreeRDP
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/archive/refs/tags/3.30.0.tar.gz
        sha256: 21b3f72bd688fcd1dbbef37b7129bfc9701906705572fce2a5a80b1e85ecc0ee

  - name: cabin
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: dir
        path: ..
      - ../cargo-sources.json

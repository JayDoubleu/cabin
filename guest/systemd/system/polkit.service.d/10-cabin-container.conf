# polkit will not start in a rootless container as Fedora ships it.
#
# The unit hardens polkitd with a set of namespace, device and seccomp
# directives, and applying them while also switching to the polkitd user needs
# CAP_SYS_ADMIN, which a rootless container does not have. systemd stops at
# "Failed to keep CAP_SYS_ADMIN" and then "Failed at step USER", and polkit
# never runs.
#
# Nothing says so. What the user sees is a desktop with no applications at
# all, because the chain is four steps long and no step reports the one below
# it:
#
#   gnome-shell asks malcontent whether an application may be shown
#   malcontent reads the parental controls property from accountsservice
#   accountsservice asks polkit to authorise the read
#   polkit is not running, so the read is denied
#
# GNOME Shell then shows nothing in the dash, nothing in the application grid,
# and search spins without ever finishing. The applications are installed and
# the desktop files are correct.
#
# Each directive was tested on its own and in groups. Relaxing any one of them
# is not enough, so they are relaxed together.
#
# NoNewPrivileges stays on, and is deliberately not listed here. Turning it off
# stops seccomp filters installing at all, because a filter needs that flag or
# CAP_SYS_ADMIN and a rootless container has neither.
#
# polkitd still runs as the polkitd user, and the desktop is still a rootless
# container under an SELinux type. This gives up defence in depth inside that
# container, not the container itself.
[Service]
PrivateDevices=no
PrivateTmp=no
PrivateNetwork=no
ProtectSystem=no
ProtectHome=no
ProtectControlGroups=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectHostname=no
RestrictNamespaces=no
RemoveIPC=no
DevicePolicy=auto
DeviceAllow=
CapabilityBoundingSet=
SystemCallFilter=
SystemCallArchitectures=
RestrictAddressFamilies=
MemoryDenyWriteExecute=no
LockPersonality=no
RestrictRealtime=no
RestrictSUIDSGID=no

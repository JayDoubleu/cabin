[workspace]
resolver = "2"
members = [
    "crates/cabin-core",
    "crates/cabin-podman",
    "crates/cabin-rdp",
    "crates/cabin-gtk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/JayDoubleu/linux-virtual-desktop-container"

[workspace.dependencies]
cabin-core = { path = "crates/cabin-core" }
cabin-podman = { path = "crates/cabin-podman" }
cabin-rdp = { path = "crates/cabin-rdp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
